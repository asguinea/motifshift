name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.11.16
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest --cov=motifshift --cov-report=term-missing --cov-fail-under=85
      - run: uv run --locked motifshift --config configs/quick.yaml --robustness --outputs outputs/ci
      - run: uv run --locked motifshift-verify --outputs outputs/ci --include-robustness --strict
      - run: uv run --locked python -m build --no-isolation
      - name: Check generated pip requirements
        shell: bash
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements.txt --output-file requirements.txt
          git diff --exit-code -- requirements.txt
